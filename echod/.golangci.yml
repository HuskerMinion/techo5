version: "2"

run:
  timeout: 5m
  go: '1.26'

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (*os.File).Close
        - (*github.com/ygelfand/go-esphome-device/mdns.Advertiser).Close
        - (*github.com/HuskerMinion/techo5/echod/internal/lib/input.Device).Close
        - (*github.com/HuskerMinion/techo5/echod/internal/lib/alsa.Mixer).Close
        - (*github.com/HuskerMinion/techo5/echod/internal/lib/alsa.Playback).Close
        - (*github.com/HuskerMinion/techo5/echod/internal/hardware/speaker.Player).Close
        - (*github.com/HuskerMinion/techo5/echod/internal/hardware/mic.Source).Close
        - (*github.com/HuskerMinion/techo5/echod/internal/android/logd.Handler).Close
        - fmt.Fprintf
        - fmt.Fprintln

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
