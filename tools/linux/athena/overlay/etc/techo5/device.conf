# Echo Show 8 (2nd gen, athena, MT8183) on Amazon's stock 32-bit kernel, or on TECHO5's own 64-bit
# mainline one (tools/linux/athena/kernel), which runs the same 32-bit userspace. Sourced by
# etc/techo5/boot.sh.
#
# There is no initramfs: the kernel mounts the system partition read-only as / and runs the athena
# /init (tools/linux/athena/init) at its root. That partition is the slot store; /init pivots into a
# slot and the store appears at /store, as on the other Shows. Userdata is Fire OS's own, so TECHO5
# keeps everything in one directory there (userdata/techo5), which /init binds to /data.
T5_PRODUCT="Echo Show 8 2nd gen Linux"
# The board this root filesystem is for. The athena store names it too (.techo5-store: board=athena),
# and slotctl installs into the other slot only a rootfs whose board matches; the daemon fetches
# release rootfs updates keyed arm-athena (echod/internal/update), never the other Shows' arm one.
T5_BOARD=athena
# The eMMC is mmcblk1 on Amazon's kernel and mmcblk0 on mainline; the partition numbers are the same.
EMMC=mmcblk1
grep -qx PARTNAME=system /sys/class/block/mmcblk0p21/uevent 2>/dev/null && EMMC=mmcblk0
STORE_DEV=/dev/${EMMC}p21
DATA_DEV=/dev/${EMMC}p23
# Drivers and firmware stay on the vendor partition, mounted read-only where they are; never copied.
# Mainline still mounts it: the speaker and microphone tuning files are there.
VENDOR_DEV=/dev/${EMMC}p12
case "$(uname -r)" in
4.*)
	FIRMWARE_PATH=/vendor/firmware
	# MT7663 over SDIO: the prealloc module first, then the driver, which makes wlan0.
	WIFI_PRE_MODULES=/vendor/lib/modules/wlan_mt76x3_sdio_prealloc.ko
	WIFI_MODULE=/vendor/lib/modules/wlan_mt76x3_sdio.ko
	# Bluetooth stays off on Amazon's kernel: it has no vhci for btbridge (no module at this path).
	BT_MODULE=/vendor/lib/modules/none.ko
	;;
*)
	# Mainline: mt7663s is built into the kernel, its firmware comes from the boot image's ramdisk
	# (tools/linux/athena/kernel); wlan0 comes up by itself.
	WIFI_MODULE=builtin
	# Wi-Fi power save off: with it on, a busy 2.4 GHz channel stalled AirPlay for long enough to end the
	# session.
	WIFI_POWER_SAVE=off
	# The sound card and the backlight probe late; the daemon opens them once, at its start.
	HW_WAIT="/dev/snd/controlC0 /sys/class/backlight/backlight-lcd0/brightness"
	# Bluetooth: btmtksdio is built in and registers hci0 itself (t5_bt_native), with its firmware
	# (mediatek/mt7663pr2h.bin, the patch Wi-Fi also uses) held from the boot image's ramdisk. BR/EDR Secure Connections off,
	# in place of btbridge's -p192-keys (t5_bt_stack).
	BT_MODULE=builtin
	BT_SC=off
	# The kernel comes with the slot: a rootfs built with KERNEL_IMAGE (deploy-rootfs.sh) carries its
	# boot image, which goes to the boot partition once the slot is good, on trial (boot.sh, Kernel).
	KERNEL_UPDATE=1
	;;
esac
# Fire OS's saved networks: its userdata is mounted whole at /store/userdata (TECHO5's /data is only
# userdata/techo5), so t5_wifi_conf looks there too, on the first boot and until one import works.
WIFI_STORES=/store/userdata/misc/wifi/WifiConfigStore.xml
# A supplicant that started on an empty configuration takes networks written into it later without a
# hand-typed `wpa_cli reconfigure` (t5_wifi_watch).
WIFI_CONF_WATCH=1
# Bring-up: RNDIS on the USB gadget next to the serial port, and SSH with a bench key when the store
# image carries one at its root (mkstore.sh -k; never in a slot image, and release images carry none).
USB_RNDIS=172.16.42.1
BENCH_SSH_KEYS=/store/root/.ssh
