# Lenovo ThinkSmart View (CD-18781Y; Qualcomm APQ8053) on the msm8953-mainline kernel under lk2nd,
# which runs the Show's 32-bit userspace. Sourced by etc/techo5/boot.sh.
T5_PRODUCT="ThinkSmart View Linux"
# The board this root filesystem is for: slotctl installs into the other slot only a rootfs whose
# board matches, and the daemon fetches release rootfs updates keyed arm-thinksmart
# (echod/internal/update), never another's.
T5_BOARD=thinksmart
EMMC=mmcblk0
# The store is inside what was Android's system partition: the kernel maps the MBR there into the
# device mapper as system1 (lk2nd's /boot) and system2 (the store), from its command line. The data is a GPT
# partition of TECHO5's own, techo5-data (tools/linux/thinksmart/repartition.sh). The store's
# /sbin/init (tools/linux/thinksmart/init) has both mounted before a slot starts; they are found by
# name, and the nodes are the kernel's.
STORE_DEV=none
DATA_DEV=none
for d in /sys/block/dm-*; do
	[ "$(cat "$d/dm/name" 2>/dev/null)" = system2 ] && STORE_DEV=/dev/${d##*/}
done
for u in /sys/class/block/mmcblk0p*/uevent; do
	grep -qx 'PARTNAME=techo5-data' "$u" 2>/dev/null && DATA_DEV=/dev/$(basename "$(dirname "$u")")
done
# ath10k (QCA9379 on SDIO) is built into the kernel and its firmware is the store's; wlan0 comes up
# by itself (the store's /sbin/init binds it again once the firmware is there), with the chip's own
# address.
WIFI_MODULE=builtin
# Power save off: with it on, a unit stopped answering the network for hours while it went on
# running and thought itself connected (2026-11-19: no ARP reply from it, the daemon's log unbroken).
WIFI_POWER_SAVE=off
# Bluetooth: the QCA9379's controller on a UART, hci_uart's Qualcomm driver from the device tree,
# which registers hci0 itself with the controller's own address.
BT_MODULE=builtin
# The sound card and the backlight probe late; the daemon opens them once, at its start.
HW_WAIT="/dev/snd/controlC0 /sys/class/backlight/backlight/brightness"
# A supplicant that started on an empty configuration takes networks written into it later
# (t5_wifi_watch).
WIFI_CONF_WATCH=1
# The kernel's drivers are built in, and those that want firmware probed before there was any: the
# store's /sbin/init starts them again, and so does this, for a store whose /sbin/init is older than
# the kernel (an update brings a new kernel, never a new store). A second run does nothing.
sh /usr/local/sbin/thinksmart-drivers 2>&1 | while read -r l; do log "drivers: $l"; done
# The boot text the way the unit stands (the store's /sbin/init does it first, where it is new enough).
sh /usr/local/sbin/thinksmart-console 2>&1 | while read -r l; do log "console: $l"; done
# The light sensor (a VCNL4200 at 0x51 on the sensors' I2C bus) has no node in the kernel's device
# tree, so it is declared here; the vcnl4000 driver, built into the kernel, then serves it
# as an IIO device, which echod reads (echod/internal/hardware/ambient/vcnl4200.go).
for bus in /sys/devices/platform/i2c-sensors/i2c-*; do
	[ -d "$bus" ] || continue
	[ -e "$bus/${bus##*/i2c-}-0051" ] || echo vcnl4200 0x51 > "$bus/new_device" 2>/dev/null
done
# The kernel comes with the root filesystem (usr/share/techo5/kernel/boot-thinksmart.img) and goes
# with the slot: the boot layer (the store's lk2nd-ab) starts each slot with its own, so there is no
# KERNEL_UPDATE here. A slot on trial is the kernel's trial too, and a kernel that breaks Wi-Fi must not
# commit, so the trial needs a default route.
TRIAL_NEEDS_NETWORK=1
# Bring-up: SSH with a bench key when the store image carries one at its root (mkstore.sh -k; never
# in a slot image, and an image for anyone carries none).
BENCH_SSH_KEYS=/store/root/.ssh
# The kernel's console is on the same framebuffer the daemon paints (msm DRM's fbdev emulation), and
# its lines would be written over the screen: the console lets go of it here, before the daemon
# starts. Until then the kernel's log is what the screen shows, which is what a unit that stops
# before this has to say for itself.
for v in /sys/class/vtconsole/vtcon*; do
	grep -q 'frame buffer' "$v/name" 2>/dev/null && [ "$(cat "$v/bind" 2>/dev/null)" = 1 ] && echo 0 > "$v/bind"
done
