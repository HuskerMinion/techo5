# Skylight Calendar 15 (150-CAL; Rockchip RK3566, Skyworth board D156) on TECHO5's own 64-bit
# mainline kernel, which runs the Show's 32-bit userspace. Sourced by etc/techo5/boot.sh.
#
# There is no initramfs: the kernel mounts techo5-store read-only as / and runs the Skylight /init
# (tools/linux/skylight/init) at its root. That partition is the slot store; /init pivots into a
# slot and the store appears at /store, as on the other Shows. techo5-data holds TECHO5's state in
# its techo5 directory, which /init binds to /data. Both partitions are TECHO5's own, made in what
# was Android's userdata; they are found by name, so the numbers below are only the fallback.
T5_PRODUCT="Skylight Calendar 15 Linux"
# The board this root filesystem is for. The Skylight store names it too (.techo5-store:
# board=skylight), and slotctl installs into the other slot only a rootfs whose board matches; the
# daemon fetches release rootfs updates keyed arm-skylight (echod/internal/update), never another's.
T5_BOARD=skylight
EMMC=mmcblk0
STORE_DEV=/dev/mmcblk0p14
DATA_DEV=/dev/mmcblk0p15
for u in /sys/class/block/mmcblk0p*/uevent; do
	case "$(grep '^PARTNAME=' "$u" 2>/dev/null)" in
	PARTNAME=techo5-store) STORE_DEV=/dev/$(basename "$(dirname "$u")") ;;
	PARTNAME=techo5-data) DATA_DEV=/dev/$(basename "$(dirname "$u")") ;;
	esac
done
# brcmfmac (AP6256, BCM43456) is built into the kernel; its firmware and NVRAM are the unit's own,
# from its stock vendor partition, kept in the store's /lib/firmware (the root when the driver asks).
# wlan0 comes up by itself.
WIFI_MODULE=builtin
# The stock NVRAM gives every unit one placeholder MAC (Broadcom's 00:90:4c range). wlan0 takes the
# unit's own instead, made from its eMMC CID exactly as echod makes its factory MAC
# (echod/internal/layout/skylight.go), so two Skylights on one network never share an address.
if [ -r /sys/class/block/mmcblk0/device/cid ] && [ -e /sys/class/net/wlan0 ]; then
	cid=$(tr 'A-F' 'a-f' < /sys/class/block/mmcblk0/device/cid | tr -d ' \n')
	h=$(printf 'techo5-skylight-mac:%s' "$cid" | sha256sum | cut -c1-12)
	first=$(printf %02x $(( (0x$(echo "$h" | cut -c1-2) & 0xfc) | 2 )))
	mac="$first:$(echo "$h" | cut -c3-4):$(echo "$h" | cut -c5-6):$(echo "$h" | cut -c7-8):$(echo "$h" | cut -c9-10):$(echo "$h" | cut -c11-12)"
	ip link set wlan0 down 2>/dev/null
	ip link set wlan0 address "$mac" 2>/dev/null
fi
# Bluetooth: the AP6256's BCM4345C5 on UART1, hci_uart's Broadcom driver built into the kernel
# (serdev, from the device tree), which registers hci0 itself. Its patch file is the unit's own too
# (brcm/BCM4345C5.hcd, in the store's /lib/firmware). The driver loads it at probe, while the store
# is still the root; the path is set for a later setup of the controller, after the slot is root.
# Unlike Wi-Fi, the controller has a real address of its own (in AMPAK's C0:F5:35 range),
# so it is kept.
BT_MODULE=builtin
FIRMWARE_PATH=/store/lib/firmware
# The sound card and the backlight probe late; the daemon opens them once, at its start.
HW_WAIT="/dev/snd/controlC0 /sys/class/backlight/backlight/brightness"
# The kernel comes with the slot: a rootfs built with KERNEL_IMAGE (deploy-rootfs.sh) carries its
# boot image, which goes to the recovery partition once the slot is good, on trial (boot.sh, Kernel;
# echod/internal/update/kernel), and only over TECHO5's own Skylight kernel.
KERNEL_UPDATE=1
# A supplicant that started on an empty configuration takes networks written into it later without a
# hand-typed `wpa_cli reconfigure` (t5_wifi_watch).
WIFI_CONF_WATCH=1
# Bring-up: RNDIS on the USB gadget next to the serial port, and SSH with a bench key when the store
# image carries one at its root (mkstore.sh -k; never in a slot image, and release images carry none).
USB_RNDIS=172.16.42.1
BENCH_SSH_KEYS=/store/root/.ssh
