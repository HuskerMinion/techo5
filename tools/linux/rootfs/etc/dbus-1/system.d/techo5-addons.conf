<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may talk to Bluetooth (BlueZ) and to the mDNS publisher (Avahi) on the system bus, and hear them.

  The packages' own policies let any user send to both (bluetooth.conf and avahi-dbus.conf: an allow in
  the default context), which on a desktop is a person at the keyboard. Here the users other than root
  are TECHO5's own (the receivers, the video decoder, avahi, the bus) and each add-on, which runs as a
  user id of its own from 30000 to 30999 with no entry in /etc/passwd (feature/addons). Left as the
  packages have it, an add-on could pair, connect and drop Bluetooth devices, or publish and withdraw
  names on the network in the device's name, over the bus; and it would hear their signals, which name
  the devices nearby and their addresses.

  So sending to both, and receiving from both, are denied in the default context, which this file, read
  after the packages' (it is in /etc/dbus-1/system.d, included after /usr/share/dbus-1/system.d), has
  the last word in; and both are allowed again to the users that use them: root (the daemon, bluetoothd,
  bluealsa on the Shows), bluealsa where it has a user of its own (the Dots), avahi, and the receivers
  (streaming: Shairport Sync publishes AirPlay through Avahi). A user context is checked after the
  default one, so these win over the deny. Tried on dbus-daemon 1.16.2, the images' version, with a
  private bus of this shape: an allowed user's calls get their replies and its signals arrive; a user
  with no allow has both refused. A policy for a user the image does not have is passed over quietly.

  The add-ons' ids cannot be named here one by one: the bus ignores a policy for a user id the user
  database does not know. Allowing the known users is the way round that. BlueALSA's own policy already
  allows only root and the audio group, which no add-on is in.

  This does not keep an add-on from sending mDNS packets of its own: it has the network, as the warning
  on the setup page says.
-->
<busconfig>
  <policy context="default">
    <deny send_destination="org.bluez"/>
    <deny receive_sender="org.bluez"/>
    <deny send_destination="org.freedesktop.Avahi"/>
    <deny receive_sender="org.freedesktop.Avahi"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.bluez"/>
    <allow receive_sender="org.bluez"/>
    <allow send_destination="org.freedesktop.Avahi"/>
    <allow receive_sender="org.freedesktop.Avahi"/>
  </policy>
  <policy user="bluealsa">
    <allow send_destination="org.bluez"/>
    <allow receive_sender="org.bluez"/>
  </policy>
  <policy user="avahi">
    <allow send_destination="org.freedesktop.Avahi"/>
    <allow receive_sender="org.freedesktop.Avahi"/>
  </policy>
  <policy user="streaming">
    <allow send_destination="org.freedesktop.Avahi"/>
    <allow receive_sender="org.freedesktop.Avahi"/>
  </policy>
</busconfig>
