blueprint:
  name: TECHO5 - set an alarm by voice
  description: >-
    Home Assistant's own voice commands know timers but not clock alarms. "Set an alarm for 6:30",
    "wake me up at half past six" or "alarm in 20 minutes" said to a TECHO5 device sets a one-time
    alarm on that device. Times are read however they are spoken: 9:38 pm, 938pm, nine thirty five,
    half past six, quarter to 7, noon or midnight, 6 in the morning, 10 tonight, 18:45, in 20
    minutes, in an hour and a half. With no AM or PM it picks the next time that comes round
    ("tomorrow" picks a morning hour). "Set a silent alarm for 6:45" sets one that makes no sound
    and only fires its event, for an automation to wake the house its own way; "wake me with the
    light at 6:30" or "set a wake light for 6:30" sets the wake light alone, with no sound and
    nothing to dismiss. One automation covers every TECHO5 device; the action name
    comes from the device's name in Home Assistant. Nothing to set.
  domain: automation
  author: TECHO5
  source_url: https://github.com/HuskerMinion/techo5/blob/main/blueprints/automation/techo5/set_alarm_by_voice.yaml
  homeassistant:
    min_version: 2024.10.0
  input: {}

triggers:
  - trigger: conversation
    id: ring
    command:
      - "set [a|an|my] alarm (for|at|in) {when}"
      - "wake me [up] (at|in) {when}"
      - "alarm (for|in) {when}"
  # A silent alarm makes no sound and only fires its event, for an automation to wake the house.
  - trigger: conversation
    id: silent
    command:
      - "set [a|an|my] (silent|quiet) alarm (for|at|in) {when}"
      - "(silent|quiet) alarm (for|at|in) {when}"
  # A light-only alarm is the wake light and nothing else: no sound, nothing to dismiss.
  - trigger: conversation
    id: light
    command:
      - "set [a|an|my] [wake] light [only] alarm (for|at|in) {when}"
      - "set [a|an|my] wake light (for|at|in) {when}"
      - "wake me [up] with [the] light (at|in) {when}"
actions:
  - variables:
      techo5: >-
        {{ trigger.device_id is not none and
           device_entities(trigger.device_id) | select('search', 'stop_alarm') | list | count > 0 }}
      node: "{{ device_attr(trigger.device_id, 'name') | slugify if techo5 else '' }}"
      spoken: "{{ (trigger.slots.when | default('')) | lower | trim }}"
      t: |-
        {%- set s = ' ' ~ spoken ~ ' ' -%}
        {%- set s = s | replace('.', '') | replace(',', ' ') | replace(':', ' ') | replace('-', ' ') | replace("o'clock", ' ') | replace('oclock', ' ') -%}
        {%- set s = s | replace(' a m ', ' am ') | replace(' p m ', ' pm ') | replace('half an hour', '30 minutes') -%}
        {%- set W = {'zero':0,'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,'eleven':11,'twelve':12,'thirteen':13,'fourteen':14,'fifteen':15,'sixteen':16,'seventeen':17,'eighteen':18,'nineteen':19,'twenty':20,'thirty':30,'forty':40,'fifty':50} -%}
        {%- set ns = namespace(n=[], tens=false, ap='', rel=0, to=false, rh=0, rm=0, rmode=false) -%}
        {%- for t0 in s.split() -%}
          {%- set t = t0 -%}
          {%- if t | length > 2 and t[-2:] in ['am','pm'] and t[:-2] | regex_match('^[0-9]+$') -%}{%- set ns.ap = t[-2:] -%}{%- set t = t[:-2] -%}{%- endif -%}
          {%- if t | regex_match('^[0-9]+$') -%}
            {%- set ns.n = ns.n + [t | int] -%}{%- set ns.tens = false -%}
          {%- elif t in W -%}
            {%- set v = W[t] -%}
            {%- if ns.tens and 1 <= v <= 9 and ns.n -%}{%- set ns.n = ns.n[:-1] + [ns.n[-1] + v] -%}{%- set ns.tens = false -%}
            {%- else -%}{%- set ns.n = ns.n + [v] -%}{%- set ns.tens = v in [20,30,40,50] -%}{%- endif -%}
          {%- elif t in ['am','pm'] -%}{%- set ns.ap = t -%}
          {%- elif t == 'noon' -%}{%- set ns.n = ns.n if ns.n else [12] -%}{%- set ns.ap = 'pm' -%}
          {%- elif t == 'midnight' -%}{%- set ns.n = ns.n if ns.n else [12] -%}{%- set ns.ap = 'am' -%}
          {%- elif t == 'half' -%}{%- set ns.rel = 30 -%}
          {%- elif t == 'quarter' -%}{%- set ns.rel = 15 -%}
          {%- elif t in ['to','till','til','before'] -%}{%- set ns.to = true -%}
          {%- elif t == 'morning' and not ns.ap -%}{%- set ns.ap = 'am' -%}
          {%- elif t in ['afternoon','evening','tonight','night'] and not ns.ap -%}{%- set ns.ap = 'pm' -%}
          {%- elif t[:4] == 'hour' or t in ['hr','hrs'] -%}{%- set ns.rmode = true -%}{%- set ns.rh = ns.rh + (ns.n[-1] if ns.n else 1) -%}{%- set ns.n = ns.n[:-1] -%}
          {%- elif t[:3] == 'min' -%}{%- set ns.rmode = true -%}{%- set ns.rm = ns.rm + (ns.n[-1] if ns.n else 1) -%}{%- set ns.n = ns.n[:-1] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if ns.rmode -%}
          {%- set tt = now() + timedelta(hours=ns.rh, minutes=ns.rm + ns.rel) -%}
          {{ {'ok': true, 'h': tt.hour, 'm': tt.minute} }}
        {%- else -%}
          {%- set n = ns.n -%}
          {%- if n and n[0] >= 100 -%}{%- set n = [n[0] // 100, n[0] % 100] + n[1:] -%}{%- endif -%}
          {%- set h = n[0] if n else -1 -%}
          {%- set mm = n[1] if n | count > 1 else 0 -%}
          {%- if ns.rel and n -%}
            {%- if ns.to -%}{%- set mm = 60 - ns.rel -%}{%- set h = h - 1 if h > 1 else 12 -%}{%- else -%}{%- set mm = ns.rel -%}{%- endif -%}
          {%- endif -%}
          {%- if h < 0 -%}{%- set hh = -1 -%}
          {%- elif ns.ap == 'pm' -%}{%- set hh = h + 12 if h < 12 else h -%}
          {%- elif ns.ap == 'am' -%}{%- set hh = 0 if h == 12 else h -%}
          {%- elif h == 0 or h > 12 -%}{%- set hh = h -%}
          {%- else -%}
            {%- set a = h % 12 -%}
            {%- set nowm = now().hour * 60 + now().minute -%}
            {%- if ' tomorrow ' in s -%}{%- set hh = a if 4 <= h <= 11 else a + 12 -%}
            {%- elif a * 60 + mm > nowm -%}{%- set hh = a -%}
            {%- elif (a + 12) * 60 + mm > nowm -%}{%- set hh = a + 12 -%}
            {%- else -%}{%- set hh = a -%}{%- endif -%}
          {%- endif -%}
          {{ {'ok': 0 <= hh <= 23 and 0 <= mm <= 59, 'h': hh, 'm': mm} }}
        {%- endif -%}
      hh: "{{ t.h }}"
      m: "{{ t.m }}"
  - choose:
      - conditions: "{{ not techo5 }}"
        sequence:
          - set_conversation_response: "Say that to the TECHO5 device you want the alarm on."
      - conditions: "{{ not t.ok }}"
        sequence:
          - set_conversation_response: "Sorry, I didn't catch what time you wanted. I heard {{ spoken }}."
    default:
      - action: "esphome.{{ node }}_alarm_set{{ {'silent': '_silent', 'light': '_light_only'}.get(trigger.id, '') }}"
        data:
          time: "{{ '%02d:%02d' | format(hh, m) }}"
          days: once
          label: Alarm
      - set_conversation_response: >-
          {{ {'silent': 'Silent alarm', 'light': 'Wake light'}.get(trigger.id, 'Alarm') }} set for
          {{ '%d:%02d %s' | format(hh % 12 or 12, m, 'AM' if hh < 12 else 'PM') }}.
mode: queued
