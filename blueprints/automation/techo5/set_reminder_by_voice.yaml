blueprint:
  name: TECHO5 - set a reminder by voice
  description: |-
    ![TECHO5 Blueprint](data:image/svg+xml;base64,)

    Home Assistant has no reminders of its own, so this hands "remind me..." to the TECHO5 device that heard it.

    - <ha-icon icon="mdi:clock-outline"></ha-icon> **A time of day or a length of time**: "in 20 minutes"
    - <ha-icon icon="mdi:calendar-sync"></ha-icon> **Days**, with weekly, every or daily: "every weekday", "weekly on Wednesday"
    - <ha-icon icon="mdi:message-text-outline"></ha-icon> **The words to say**
    - <ha-icon icon="mdi:bell-plus-outline"></ha-icon> **"Set a reminder..."** too, which Home Assistant would otherwise take as a timer

    <ha-alert alert-type="success" title="Nothing to set">Create an automation from it and it works on every TECHO5 device.</ha-alert>

    <details><summary>Good to know</summary>

    The sentence is taken apart here, because speech to text writes times many ways ("8.14am", "8 a m", "830pm", "8-18 AM"). A one-time reminder on a particular day is not something the device can hold yet, and it says so. The action name comes from the device's name in Home Assistant.

    </details>

    ---

    <sub><ha-icon icon="mdi:book-open-variant"></ha-icon> [All TECHO5 blueprints](https://github.com/HuskerMinion/techo5/blob/main/blueprints/README.md) · <ha-icon icon="mdi:github"></ha-icon> [Source](https://github.com/HuskerMinion/techo5/blob/main/blueprints/automation/techo5/set_reminder_by_voice.yaml) · <ha-icon icon="mdi:bug-outline"></ha-icon> [Report an issue](https://github.com/HuskerMinion/techo5/issues)</sub>
  domain: automation
  author: TECHO5
  source_url: https://github.com/HuskerMinion/techo5/blob/main/blueprints/automation/techo5/set_reminder_by_voice.yaml
  homeassistant:
    min_version: 2024.10.0
  input: {}

triggers:
  - trigger: conversation
    command:
      - "remind me {rest}"
      - "set [a|an] [new] [weekly|daily|recurring] reminder {rest}"
      - "(create|add|make) [a|an] [new] [weekly|daily|recurring] reminder {rest}"
conditions:
  - "{{ device_entities(trigger.device_id) | select('search', 'stop_alarm') | list | count > 0 }}"
actions:
  - variables:
      p: |-
        {%- set raw = (trigger.slots.rest | default('')) | replace('A.M.','am') | replace('a.m.','am') | replace('P.M.','pm') | replace('p.m.','pm') | replace('A.M','am') | replace('a.m','am') | replace('P.M','pm') | replace('p.m','pm') | replace('AM','am') | replace('PM','pm') -%}
        {%- set raw = raw | regex_replace('(?i)([0-9]) ?([ap]) m(?=[^a-z]|$)', '\\1 \\2m') | regex_replace('(?i)(^|[^0-9:.])([0-9]{1,2})([0-9]{2}) ?(am|pm)(?=[^a-z]|$)', '\\1\\2:\\3 \\4') | regex_replace('(?i)(^|[ ])(at|for|by) ([0-9]{1,2})([0-9]{2})(?=[^0-9a-z:]|$)', '\\1\\2 \\3:\\4') -%}
        {%- set whole = (trigger.sentence ~ ' ' ~ raw) | lower -%}
        {%- set clock = (raw | regex_findall('(?i)(?:^|[^0-9])([0-9]{1,2}(?:[.:-][0-9]{2})? ?(?:am|pm)|[0-9]{1,2}[.:-][0-9]{2}|noon|midnight)(?=[^0-9a-z]|$)') | first) if raw | regex_search('(?i)(?:^|[^0-9])([0-9]{1,2}(?:[.:-][0-9]{2})? ?(?:am|pm)|[0-9]{1,2}[.:-][0-9]{2}|noon|midnight)(?=[^0-9a-z]|$)') else '' -%}
        {%- set span = (raw | regex_findall('(?i)(?:^|[^a-z0-9])((?:[0-9]+|an?|one|two|three|four|five|ten|fifteen|twenty|thirty|half an?) ?(?:seconds?|secs?|minutes?|mins?|hours?|hrs?))(?=[^a-z]|$)') | first) if raw | regex_search('(?i)(?:^|[^a-z0-9])((?:[0-9]+|an?|one|two|three|four|five|ten|fifteen|twenty|thirty|half an?) ?(?:seconds?|secs?|minutes?|mins?|hours?|hrs?))(?=[^a-z]|$)') else '' -%}
        {%- set ns = namespace(days=[]) -%}
        {%- for d in ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] if d in whole -%}{%- set ns.days = ns.days + [d] -%}{%- endfor -%}
        {%- set repeat = 'weekly' in whole or 'every ' in whole or 'each ' in whole -%}
        {%- set days = 'daily' if ('daily' in whole or 'every day' in whole or 'each day' in whole) else ('weekdays' if 'weekday' in whole else ('weekends' if 'weekend' in whole else (ns.days | join(',') if ns.days and repeat else ''))) -%}
        {%- set when = (clock | replace('.', ':') | replace('-', ':')) if clock else ('in ' ~ span if span else '') -%}
        {%- set cut = raw -%}
        {%- if clock -%}{%- set cut = cut | replace(clock, ' ') -%}{%- endif -%}
        {%- if span -%}{%- set cut = cut | replace(span, ' ') -%}{%- endif -%}
        {%- set label = cut
          | regex_replace('(?i)(^|[ ,])(?:on |every |each )?(?:mondays?|tuesdays?|wednesdays?|thursdays?|fridays?|saturdays?|sundays?|weekdays?|weekends?|day)(?=[ ,.!?]|$)', ' ')
          | regex_replace('(?i)(^|[ ,])(?:weekly|daily|every week|each week)(?=[ ,.!?]|$)', ' ')
          | regex_replace('(?i)(^|[ ])(?:at|for|in|after|by|on)(?=[ ]*([.,!?]|$))', ' ')
          | regex_replace('(?i)(^|[ ])(?:at|for|in|after|by|on) (?=(at|for|in|after|by|on|to) )', ' ')
          | regex_replace('[ ]+', ' ') | trim
          | regex_replace('^[.,!?;: ]+', '') | regex_replace('[.,!?;: ]+$', '')
          | regex_replace('(?i)^(?:(?:at|for|in|by|on) )+', '')
          | regex_replace('(?i)^(?:to|that|for|about|of) ', '') | trim -%}
        {%- set label = label | regex_replace('(?i) (?:at|for|in|by|on)$', '') | trim -%}
        {{ {'when': when, 'days': days, 'label': label, 'oneoff': (ns.days | count > 0 and not repeat)} }}
  - choose:
      - conditions: "{{ p.oneoff }}"
        sequence:
          - set_conversation_response: >-
              I can't set a one-time reminder for a particular day yet. Say weekly, or every Tuesday,
              to repeat it, or give just a time for the next time it comes around.
      - conditions: "{{ p.when == '' }}"
        sequence:
          - set_conversation_response: "What time should I remind you? Try at 7:30 PM, or in 20 minutes."
      - conditions: "{{ p.label == '' }}"
        sequence:
          - set_conversation_response: "What should I remind you about?"
    default:
      - action: "esphome.{{ device_attr(trigger.device_id, 'name') | slugify }}_reminder_set"
        data:
          time: "{{ p.when }}"
          days: "{{ p.days }}"
          label: "{{ p.label }}"
          ring_on: ""
        response_variable: set
        continue_on_error: true
      - if: "{{ set is defined and set.id is defined }}"
        then:
          - set_conversation_response: >-
              OK, I'll remind you to {{ p.label }} {{ p.when if p.when.startswith('in ') else 'at ' ~ p.when }}{{
              {'daily': ' every day', 'weekdays': ' on weekdays', 'weekends': ' on weekends', '': ''}.get(p.days, ' every ' ~ (p.days | replace(',', ', ') | title)) }}.
        else:
          - set_conversation_response: "Sorry, I couldn't set that reminder. Try a time like 7:30 PM, or in 20 minutes."
mode: queued
