blueprint:
  name: TECHO5 - help by voice
  description: |-
    ![TECHO5 Blueprint](data:image/svg+xml;base64,)

    Gets help when someone in the house asks for it.

    - <ha-icon icon="mdi:alarm-light-outline"></ha-icon> **"I need help"**, **"help me"**, **"emergency"** said to a TECHO5 device
    - <ha-icon icon="mdi:cellphone-message"></ha-icon> **Your alert actions run**: tell phones
    - <ha-icon icon="mdi:phone-outgoing"></ha-icon> **Calls each number in turn** from that device until one answers
    - <ha-icon icon="mdi:account-voice"></ha-icon> **Someone answers**: the device tells them which room asked for help

    <ha-alert alert-type="info" title="Before you start">The calls need the device's phone signed in; the alert runs either way.</ha-alert>

    <ha-alert alert-type="warning" title="Voicemail counts as an answer">A voicemail box answering stops the list there.</ha-alert>

    ---

    <sub><ha-icon icon="mdi:book-open-variant"></ha-icon> [All TECHO5 blueprints](https://github.com/HuskerMinion/techo5/blob/main/blueprints/README.md) · <ha-icon icon="mdi:github"></ha-icon> [Source](https://github.com/HuskerMinion/techo5/blob/main/blueprints/automation/techo5/help_by_voice.yaml) · <ha-icon icon="mdi:bug-outline"></ha-icon> [Report an issue](https://github.com/HuskerMinion/techo5/issues)</sub>
  domain: automation
  author: TECHO5
  source_url: https://github.com/HuskerMinion/techo5/blob/main/blueprints/automation/techo5/help_by_voice.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    alert:
      name: Alert
      description: >-
        What to do first, such as a high-priority notification to phones. `{{ room }}` is the name
        of the device that heard it.
      default: []
      selector:
        action: {}
    numbers:
      name: Numbers to call
      description: Called in this order until one answers. Leave empty to only run the alert.
      default: []
      selector:
        text:
          multiple: true
    ring_seconds:
      name: Ring each number for
      default: 70
      selector:
        number:
          min: 15
          max: 180
          unit_of_measurement: seconds
    announcement:
      name: What to say when someone answers
      default: "This is a help call from the {{ room }}. Someone here asked for help."
      selector:
        text:
          multiline: true

variables:
  numbers: !input numbers
  ring_seconds: !input ring_seconds
triggers:
  - trigger: conversation
    command:
      - "I need help"
      - "help me"
      - "emergency"
actions:
  - variables:
      device: "{{ trigger.device_id }}"
      room: "{{ device_attr(device, 'name') if device else 'Home Assistant app' }}"
      call: "esphome.{{ room | slugify }}_phone_call"
      hangup: "esphome.{{ room | slugify }}_phone_hangup"
      satellite: >-
        {{ (device_entities(device) | select('match', 'assist_satellite[.]') | list + [''])
           | first if device else '' }}
      # The Phone sensor (sensor.<device>_phone) is there only on a device that can call.
      can_call: "{{ device is not none and device_entities(device) | select('search', '^sensor[.].*_phone$') | list | count > 0 }}"
  - choose: []
    default: !input alert
  - set_conversation_response: "{{ 'Calling for help now.' if can_call and numbers else 'I have let everyone know.' }}"
  - if: "{{ not can_call }}"
    then:
      - stop: No phone on this device
  - repeat:
      for_each: "{{ numbers }}"
      sequence:
        # A call that fails to start (the line still busy) moves on to the next number.
        - action: "{{ call }}"
          continue_on_error: true
          data:
            number: "{{ repeat.item }}"
        # dialing arrives first and decides nothing: wait for what does.
        - wait_for_trigger:
            - trigger: event
              event_type: esphome.techo5_phone
              event_data: { device: "{{ room }}", event: answered }
            - trigger: event
              event_type: esphome.techo5_phone
              event_data: { device: "{{ room }}", event: not_answered }
            - trigger: event
              event_type: esphome.techo5_phone
              event_data: { device: "{{ room }}", event: ended }
          timeout: "{{ ring_seconds }}"
        - if: "{{ wait.trigger is not none and wait.trigger.event.data.event == 'answered' }}"
          then:
            - delay: 1
            - action: assist_satellite.announce
              target:
                entity_id: "{{ satellite }}"
              data:
                message: !input announcement
                preannounce: false
            - stop: answered
          else:
            # Hung up here, the line comes free once the device says the call was not answered.
            - if: "{{ wait.trigger is none }}"
              then:
                - action: "{{ hangup }}"
                  continue_on_error: true
                - wait_for_trigger:
                    - trigger: event
                      event_type: esphome.techo5_phone
                      event_data: { device: "{{ room }}", event: not_answered }
                  timeout: 5
            - delay: 1
mode: single
