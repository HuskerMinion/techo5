<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1000" height="720" rx="18" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#111827">Echo Show 8 2nd gen (athena): microphones, seen from above</text>
  <text x="500" y="66" text-anchor="middle" font-size="15" fill="#6b7280">Schematic, not to scale. Microphones about 20 mm apart side to side and 22 mm front to back (clap timing on one unit, ±5 mm).</text>

  <!-- top surface: fabric behind, black button strip along the front edge -->
  <text x="250" y="104" text-anchor="middle" font-size="16" fill="#374151">back (fabric)</text>
  <path d="M100 290 L100 145 Q100 115 130 115 L870 115 Q900 115 900 145 L900 290 Z" fill="#d1d5db"/>
  <path d="M100 290 L900 290 L900 335 Q900 360 875 360 L125 360 Q100 360 100 335 Z" fill="#1f2937"/>
  <text x="250" y="420" text-anchor="middle" font-size="16" fill="#374151">front (screen)</text>

  <!-- buttons, left to right as seen from the front -->
  <g stroke="#9ca3af" stroke-width="2" fill="#374151">
    <circle cx="500" cy="325" r="15"/>
    <circle cx="600" cy="325" r="15"/>
    <circle cx="700" cy="325" r="15"/>
    <rect x="790" y="313" width="60" height="24" rx="12"/>
  </g>
  <circle cx="808" cy="325" r="8" fill="#9ca3af"/>
  <g font-size="18" fill="#e5e7eb" text-anchor="middle">
    <text x="500" y="331" font-size="14">⊘</text>
    <text x="600" y="331">−</text>
    <text x="700" y="331">+</text>
  </g>
  <g font-size="14" fill="#374151" text-anchor="middle">
    <text x="500" y="385">mute</text>
    <text x="600" y="385">vol −</text>
    <text x="700" y="385">vol +</text>
    <text x="820" y="385">camera shutter</text>
  </g>

  <!-- the two visible holes -->
  <circle cx="550" cy="325" r="4" fill="#000000" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="650" cy="325" r="4" fill="#000000" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- microphone board under the top, and the four microphones (converter channel numbers) -->
  <rect x="510" y="200" width="180" height="150" rx="6" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="600" y="192" text-anchor="middle" font-size="13" fill="#15803d">microphone board (inside)</text>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#15803d">
    <circle cx="550" cy="325" r="13" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="550" y="281">ch3</text>
    <circle cx="650" cy="325" r="13" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="650" y="281">ch2</text>
    <circle cx="550" cy="237" r="13" fill="#86efac" stroke="#15803d" stroke-width="3"/>
    <text x="550" y="218">ch0</text>
    <circle cx="650" cy="237" r="13" fill="#86efac" stroke="#15803d" stroke-width="3"/>
    <text x="650" y="218">ch1</text>
  </g>

  <!-- tap points -->
  <g stroke="#dc2626" stroke-width="2">
    <line x1="550" y1="325" x2="420" y2="235"/>
    <line x1="650" y1="325" x2="780" y2="235"/>
    <line x1="600" y1="358" x2="470" y2="455"/>
    <line x1="600" y1="270" x2="430" y2="160"/>
  </g>
  <circle cx="600" cy="358" r="6" fill="#dc2626"/>
  <circle cx="600" cy="270" r="6" fill="#dc2626"/>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="420" cy="235" r="15" fill="#dc2626"/><text x="420" y="241">1</text>
    <circle cx="780" cy="235" r="15" fill="#dc2626"/><text x="780" y="241">2</text>
    <circle cx="470" cy="455" r="15" fill="#dc2626"/><text x="470" y="461">3</text>
    <circle cx="430" cy="160" r="15" fill="#dc2626"/><text x="430" y="166">4</text>
  </g>

  <!-- clap directions -->
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <line x1="610" y1="520" x2="610" y2="400" marker-end="url(#a)"/>
    <line x1="20" y1="250" x2="90" y2="250" marker-end="url(#a)"/>
    <line x1="980" y1="250" x2="910" y2="250" marker-end="url(#a)"/>
  </g>
  <g font-size="14" fill="#2563eb" text-anchor="middle">
    <text x="610" y="540">clap, front</text>
    <text x="52" y="236">clap, left</text>
    <text x="948" y="236">clap, right</text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#111827">
    <circle cx="60" cy="580" r="11" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="85" y="585">microphone under a hole in the top strip (ch3 left, ch2 right)</text>
    <circle cx="60" cy="612" r="11" fill="#86efac" stroke="#15803d" stroke-width="3"/>
    <text x="85" y="617">microphone under the fabric, no visible hole (ch0, ch1), about 22 mm further back</text>
    <circle cx="60" cy="644" r="11" fill="#dc2626"/>
    <text x="85" y="649">tap points: 1 left hole, 2 right hole, 3 front edge of the top, 4 fabric behind vol −</text>
    <line x1="45" y1="676" x2="75" y2="676" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
    <text x="85" y="681">clap directions, about 1 m away; left and right as seen from the front</text>
    <text x="85" y="706" fill="#6b7280">Channels are the TLV320ADC5140's as TECHO5's mainline kernel delivers them (hw:0,2).</text>
  </g>
</svg>
