<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="18" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="600" fill="#111827">Touch on the clock (Echo Show)</text>

  <!-- device -->
  <rect x="290" y="110" width="620" height="400" rx="26" fill="#1f2937"/>
  <rect x="320" y="135" width="560" height="350" rx="6" fill="#0f172a"/>
  <!-- edge strips -->
  <rect x="320" y="135" width="560" height="34" fill="#2563eb" opacity="0.22"/>
  <rect x="320" y="451" width="560" height="34" fill="#2563eb" opacity="0.22"/>
  <rect x="320" y="135" width="40" height="350" fill="#2563eb" opacity="0.22"/>
  <rect x="840" y="135" width="40" height="350" fill="#2563eb" opacity="0.22"/>
  <!-- clock face -->
  <text x="600" y="320" text-anchor="middle" font-size="96" font-weight="300" fill="#f9fafb">10:42</text>
  <text x="600" y="365" text-anchor="middle" font-size="24" fill="#cbd5e1">Saturday, October 25</text>
  <text x="790" y="205" text-anchor="end" font-size="22" fill="#cbd5e1">☀ 54°</text>
  <rect x="470" y="395" width="260" height="36" rx="8" fill="#334155"/>
  <text x="600" y="419" text-anchor="middle" font-size="16" fill="#e2e8f0">Next: Dentist 2:30 PM</text>

  <!-- edge arrows -->
  <line x1="600" y1="140" x2="600" y2="200" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <line x1="600" y1="480" x2="600" y2="440" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <line x1="326" y1="250" x2="386" y2="250" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <line x1="874" y1="250" x2="814" y2="250" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>

  <!-- callouts: top -->
  <text x="600" y="82" text-anchor="middle" font-size="19" fill="#111827"><tspan font-weight="600">Down from the top edge:</tspan> Settings</text>
  <!-- bottom -->
  <text x="600" y="540" text-anchor="middle" font-size="19" fill="#111827"><tspan font-weight="600">Up from the bottom edge:</tspan> the deck, once one is set up</text>
  <!-- left -->
  <text x="270" y="244" text-anchor="end" font-size="19" font-weight="600" fill="#111827">In from the left edge:</text>
  <text x="270" y="268" text-anchor="end" font-size="19" fill="#111827">the dashboard,</text>
  <text x="270" y="292" text-anchor="end" font-size="19" fill="#111827">once one is set up</text>
  <!-- right -->
  <text x="930" y="244" font-size="19" font-weight="600" fill="#111827">In from the right edge:</text>
  <text x="930" y="268" font-size="19" fill="#111827">the drawer (Cameras,</text>
  <text x="930" y="292" font-size="19" fill="#111827">Radio and more)</text>

  <!-- tap callouts -->
  <line x1="795" y1="198" x2="930" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="935" y="155" font-size="17" fill="#374151"><tspan font-weight="600">Tap the weather:</tspan> forecast</text>
  <line x1="740" y1="358" x2="930" y2="370" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="935" y="366" font-size="17" fill="#374151"><tspan font-weight="600">Tap the date:</tspan> calendar</text>
  <line x1="730" y1="413" x2="930" y2="420" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="935" y="416" font-size="17" fill="#374151"><tspan font-weight="600">Tap an event:</tspan> that day</text>

  <!-- anywhere else -->
  <rect x="60" y="580" width="1080" height="150" rx="12" fill="#f3f4f6"/>
  <text x="90" y="616" font-size="19" font-weight="600" fill="#111827">Anywhere else on the clock</text>
  <text x="90" y="648" font-size="18" fill="#374151">• <tspan font-weight="600">Tap:</tspan> talk to it (Settings → Tap on the clock can make it the dashboard, the deck, or nothing)</text>
  <text x="90" y="676" font-size="18" fill="#374151">• <tspan font-weight="600">Swipe up or down:</tspan> volume (Swipe for volume)   • <tspan font-weight="600">Swipe left or right:</tspan> the next clock style</text>
  <text x="90" y="704" font-size="18" fill="#374151">• <tspan font-weight="600">Hold half a second:</tspan> an event in Home Assistant (Hold on the clock, off unless turned on)</text>
</svg>
